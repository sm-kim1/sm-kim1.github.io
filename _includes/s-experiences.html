{% assign d = site.data[page.data_file] %}
<section class="section">
  <div class="section-label">03 · EXPERIENCE</div>
  {% for xp in d.experiences.info %}
  <div class="xp-company">
    <div class="company-line">
      <h3>{{ xp.company }}</h3>
      <span class="meta">{{ xp.time }}</span>
    </div>
    {% if xp.note %}<p class="company-note">{{ xp.note }}</p>{% endif %}
    {% for r in xp.roles %}
    <div class="xp-role">
      <h4>{{ r.role }}</h4>
      <p class="meta">{{ r.time }}</p>
      {{ r.details | markdownify }}
    </div>
    {% endfor %}
  </div>
  {% endfor %}
</section>
