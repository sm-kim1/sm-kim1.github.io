{% assign sb = site.data[page.data_file].sidebar %}
<header class="site-header">
  <h1>김상민 <span class="name-en">{{ sb.name }}</span></h1>
  <p class="tagline">{{ sb.tagline }}</p>
  <p class="contacts">
    <a href="mailto:{{ sb.email }}">{{ sb.email }}</a>
    <span class="sep">·</span>
    <a href="https://github.com/{{ sb.github }}" target="_blank" rel="noopener">github.com/{{ sb.github }}</a>
    <span class="sep">·</span>
    <a href="https://www.linkedin.com/in/{{ sb.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
  </p>
  {% assign d = site.data[page.data_file] %}
  {% for e in d.education.info %}
  <p class="edu">{{ e.university }} · {{ e.degree }}</p>
  {% endfor %}
</header>
