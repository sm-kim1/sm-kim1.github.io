<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Runtime Component Manager with Dynamic Device Pool" font-family="IBM Plex Sans, system-ui, sans-serif">
  <defs>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F5959"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1A1A1A" flood-opacity="0.10"/>
    </filter>
    <filter id="soft-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A1A1A" flood-opacity="0.08"/>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#E5E2D8"/>
    </pattern>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4D7C7D"/>
      <stop offset="1" stop-color="#3D6768"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#FAFAF7"/>
  <rect width="1600" height="900" fill="url(#dots)" opacity="0.55"/>

  <!-- title block -->
  <g>
    <rect x="60" y="48" width="8" height="56" fill="#C97A5C"/>
    <text x="92" y="76" fill="#9A988F" font-size="20" font-family="IBM Plex Mono, monospace" letter-spacing="4" font-weight="600">DIAGRAM 01</text>
    <text x="92" y="106" fill="#1A1A1A" font-size="34" font-weight="600" letter-spacing="-0.5">Runtime Component Manager — Dynamic Device Pool</text>
  </g>

  <!-- device layer band -->
  <g filter="url(#soft-sm)">
    <rect x="330" y="150" width="940" height="130" rx="10" fill="#F1EFE7"/>
  </g>
  <text x="360" y="180" fill="#77756C" font-size="17" font-family="IBM Plex Mono, monospace" letter-spacing="3" font-weight="600">PHYSICAL DEVICES</text>
  <g filter="url(#soft-sm)">
    <g>
      <rect x="360" y="196" width="200" height="64" rx="8" fill="#FFFFFF" stroke="#D8D5C9" stroke-width="1.5"/>
      <circle cx="388" cy="228" r="7" fill="#4D7C7D"/>
      <text x="404" y="236" fill="#1A1A1A" font-size="24" font-weight="500">Device A</text>
    </g>
    <g>
      <rect x="584" y="196" width="200" height="64" rx="8" fill="#FFFFFF" stroke="#D8D5C9" stroke-width="1.5"/>
      <circle cx="612" cy="228" r="7" fill="#4D7C7D"/>
      <text x="628" y="236" fill="#1A1A1A" font-size="24" font-weight="500">Device B</text>
    </g>
    <g>
      <rect x="808" y="196" width="200" height="64" rx="8" fill="#FFFFFF" stroke="#D8D5C9" stroke-width="1.5"/>
      <circle cx="836" cy="228" r="7" fill="#C97A5C"/>
      <text x="852" y="236" fill="#1A1A1A" font-size="24" font-weight="500">Device C</text>
    </g>
    <g>
      <rect x="1032" y="196" width="200" height="64" rx="8" fill="#FFFFFF" stroke="#D8D5C9" stroke-width="1.5" stroke-dasharray="5 4"/>
      <circle cx="1060" cy="228" r="7" fill="none" stroke="#9A988F" stroke-width="2"/>
      <text x="1076" y="236" fill="#77756C" font-size="24" font-weight="500">Device N</text>
    </g>
  </g>

  <!-- hotplug arrows -->
  <path d="M 700 285 C 700 320, 780 320, 790 348" stroke="#2F5959" stroke-width="3" fill="none" marker-end="url(#ah2)"/>
  <path d="M 905 285 C 905 320, 825 320, 812 348" stroke="#C97A5C" stroke-width="3" fill="none" stroke-dasharray="8 6" marker-end="url(#ah2)"/>
  <text x="960" y="325" fill="#C97A5C" font-size="19" font-family="IBM Plex Mono, monospace" font-weight="600">hot-plug / detach</text>
  <text x="560" y="325" fill="#2F5959" font-size="19" font-family="IBM Plex Mono, monospace" font-weight="600">register</text>

  <!-- manager card -->
  <g filter="url(#soft)">
    <rect x="120" y="355" width="1360" height="360" rx="14" fill="#FFFFFF"/>
    <rect x="120" y="355" width="1360" height="66" rx="14" fill="url(#hdr)"/>
    <rect x="120" y="404" width="1360" height="17" fill="#FFFFFF"/>
  </g>
  <text x="152" y="398" fill="#FFFFFF" font-size="28" font-weight="600" letter-spacing="-0.3">Runtime Component Manager</text>
  <text x="1448" y="397" fill="#CFE0E0" font-size="18" font-family="IBM Plex Mono, monospace" letter-spacing="3" text-anchor="end" font-weight="600">DYNAMIC DEVICE POOL</text>

  <!-- slots -->
  <g filter="url(#soft-sm)">
    <rect x="152" y="446" width="248" height="150" rx="10" fill="#EAF1F1" stroke="#4D7C7D" stroke-width="2"/>
    <rect x="416" y="446" width="248" height="150" rx="10" fill="#EAF1F1" stroke="#4D7C7D" stroke-width="2"/>
    <rect x="680" y="446" width="248" height="150" rx="10" fill="#F8EEE9" stroke="#C97A5C" stroke-width="2"/>
    <rect x="944" y="446" width="248" height="150" rx="10" fill="#FAFAF7" stroke="#C5C2B8" stroke-width="2" stroke-dasharray="5 5"/>
    <rect x="1208" y="446" width="240" height="150" rx="10" fill="#FAFAF7" stroke="#C5C2B8" stroke-width="2" stroke-dasharray="5 5"/>
  </g>

  <g font-family="IBM Plex Mono, monospace" font-weight="600">
    <text x="176" y="482" fill="#2F5959" font-size="18" letter-spacing="2">SLOT 01</text>
    <text x="440" y="482" fill="#2F5959" font-size="18" letter-spacing="2">SLOT 02</text>
    <text x="704" y="482" fill="#A65D41" font-size="18" letter-spacing="2">SLOT 03</text>
    <text x="968" y="482" fill="#9A988F" font-size="18" letter-spacing="2">SLOT 04</text>
    <text x="1232" y="482" fill="#9A988F" font-size="18" letter-spacing="2">SLOT N</text>
  </g>

  <!-- slot status pills -->
  <g font-size="15" font-family="IBM Plex Mono, monospace" font-weight="600">
    <rect x="316" y="464" width="66" height="26" rx="13" fill="#4D7C7D"/>
    <text x="349" y="482" fill="#FFFFFF" text-anchor="middle">LIVE</text>
    <rect x="580" y="464" width="66" height="26" rx="13" fill="#4D7C7D"/>
    <text x="613" y="482" fill="#FFFFFF" text-anchor="middle">LIVE</text>
    <rect x="836" y="464" width="74" height="26" rx="13" fill="#C97A5C"/>
    <text x="873" y="482" fill="#FFFFFF" text-anchor="middle">INIT</text>
    <rect x="1100" y="464" width="74" height="26" rx="13" fill="#E5E2D8"/>
    <text x="1137" y="482" fill="#77756C" text-anchor="middle">FREE</text>
    <rect x="1364" y="464" width="66" height="26" rx="13" fill="#E5E2D8"/>
    <text x="1397" y="482" fill="#77756C" text-anchor="middle">FREE</text>
  </g>

  <g font-size="24" font-weight="500">
    <text x="276" y="545" fill="#1A1A1A" text-anchor="middle">Device A</text>
    <text x="540" y="545" fill="#1A1A1A" text-anchor="middle">Device B</text>
    <text x="804" y="545" fill="#1A1A1A" text-anchor="middle">Device C</text>
    <text x="1068" y="545" fill="#9A988F" text-anchor="middle" font-size="20">— free —</text>
    <text x="1328" y="545" fill="#9A988F" text-anchor="middle" font-size="20">— free —</text>
  </g>
  <g font-size="16" fill="#77756C">
    <text x="276" y="574" text-anchor="middle">uptime 14d · if cached</text>
    <text x="540" y="574" text-anchor="middle">uptime 6d · if cached</text>
    <text x="804" y="574" text-anchor="middle">binding interface…</text>
  </g>

  <!-- capability strip -->
  <g font-family="IBM Plex Mono, monospace" font-size="18" font-weight="600">
    <g filter="url(#soft-sm)">
      <rect x="152" y="630" width="300" height="52" rx="26" fill="#FFFFFF" stroke="#D8D5C9" stroke-width="1.5"/>
      <rect x="480" y="630" width="280" height="52" rx="26" fill="#FFFFFF" stroke="#D8D5C9" stroke-width="1.5"/>
      <rect x="788" y="630" width="330" height="52" rx="26" fill="#FFFFFF" stroke="#D8D5C9" stroke-width="1.5"/>
      <rect x="1146" y="630" width="302" height="52" rx="26" fill="#FFFFFF" stroke="#D8D5C9" stroke-width="1.5"/>
    </g>
    <circle cx="186" cy="656" r="6" fill="#4D7C7D"/><text x="206" y="663" fill="#1A1A1A" letter-spacing="2">REGISTRATION</text>
    <circle cx="514" cy="656" r="6" fill="#4D7C7D"/><text x="534" y="663" fill="#1A1A1A" letter-spacing="2">LIFECYCLE</text>
    <circle cx="822" cy="656" r="6" fill="#4D7C7D"/><text x="842" y="663" fill="#1A1A1A" letter-spacing="2">INTERFACE CACHE</text>
    <circle cx="1180" cy="656" r="6" fill="#C97A5C"/><text x="1200" y="663" fill="#1A1A1A" letter-spacing="2">RECOVERY</text>
  </g>

  <!-- down arrow -->
  <path d="M 800 722 L 800 775" stroke="#2F5959" stroke-width="3" fill="none" marker-end="url(#ah2)"/>

  <!-- ROS2 layer -->
  <g filter="url(#soft-sm)">
    <rect x="470" y="785" width="660" height="76" rx="10" fill="#2F3B3B"/>
  </g>
  <text x="800" y="824" fill="#FFFFFF" font-size="26" text-anchor="middle" font-weight="500">ROS2 Middleware Module</text>
  <text x="800" y="850" fill="#9FB8B8" font-size="16" text-anchor="middle" font-family="IBM Plex Mono, monospace" letter-spacing="2">DDS · rclcpp · lifecycle nodes</text>
</svg>
