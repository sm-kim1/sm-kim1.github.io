<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Common SW Architecture" font-family="IBM Plex Sans, system-ui, sans-serif">
  <defs>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F5959"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1A1A1A" flood-opacity="0.10"/>
    </filter>
    <filter id="soft-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A1A1A" flood-opacity="0.08"/>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#E5E2D8"/>
    </pattern>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4D7C7D"/>
      <stop offset="1" stop-color="#3D6768"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#FAFAF7"/>
  <rect width="1600" height="900" fill="url(#dots)" opacity="0.55"/>

  <!-- title block -->
  <g>
    <rect x="60" y="48" width="8" height="56" fill="#C97A5C"/>
    <text x="92" y="76" fill="#9A988F" font-size="20" font-family="IBM Plex Mono, monospace" letter-spacing="4" font-weight="600">DIAGRAM 02</text>
    <text x="92" y="106" fill="#1A1A1A" font-size="34" font-weight="600" letter-spacing="-0.5">Common SW Architecture — Standard-based Message Interface</text>
  </g>

  <!-- standards band -->
  <g filter="url(#soft-sm)">
    <rect x="80" y="180" width="360" height="560" rx="10" fill="#F1EFE7"/>
  </g>
  <text x="110" y="222" fill="#77756C" font-size="17" font-family="IBM Plex Mono, monospace" letter-spacing="3" font-weight="600">STANDARDS</text>

  <g filter="url(#soft-sm)">
    <rect x="110" y="250" width="300" height="150" rx="8" fill="#FFFFFF" stroke="#D8D5C9" stroke-width="1.5"/>
    <rect x="110" y="430" width="300" height="150" rx="8" fill="#FFFFFF" stroke="#D8D5C9" stroke-width="1.5"/>
  </g>
  <text x="260" y="315" fill="#1A1A1A" font-size="32" text-anchor="middle" font-weight="600">STANAG</text>
  <text x="260" y="352" fill="#77756C" font-size="17" text-anchor="middle" font-family="IBM Plex Mono, monospace">command-message spec</text>
  <text x="260" y="495" fill="#1A1A1A" font-size="32" text-anchor="middle" font-weight="600">JAUS</text>
  <text x="260" y="532" fill="#77756C" font-size="17" text-anchor="middle" font-family="IBM Plex Mono, monospace">interoperability spec</text>
  <text x="260" y="690" fill="#9A988F" font-size="16" text-anchor="middle" font-family="IBM Plex Mono, monospace" letter-spacing="1">analyzed &amp; mapped</text>

  <!-- arrows standards -> interface -->
  <path d="M 445 325 C 520 325, 540 400, 588 420" stroke="#2F5959" stroke-width="3" fill="none" marker-end="url(#ah2)"/>
  <path d="M 445 505 C 520 505, 540 470, 588 460" stroke="#2F5959" stroke-width="3" fill="none" marker-end="url(#ah2)"/>
  <text x="512" y="392" fill="#2F5959" font-size="17" font-family="IBM Plex Mono, monospace" font-weight="600" text-anchor="middle">normalize</text>

  <!-- common interface card -->
  <g filter="url(#soft)">
    <rect x="600" y="230" width="420" height="480" rx="14" fill="#FFFFFF"/>
    <rect x="600" y="230" width="420" height="66" rx="14" fill="url(#hdr)"/>
    <rect x="600" y="279" width="420" height="17" fill="#FFFFFF"/>
  </g>
  <text x="810" y="272" fill="#FFFFFF" font-size="26" font-weight="600" text-anchor="middle">Common Message Interface</text>

  <g font-family="IBM Plex Mono, monospace" font-size="17" font-weight="600">
    <g filter="url(#soft-sm)">
      <rect x="640" y="330" width="340" height="72" rx="8" fill="#EAF1F1" stroke="#4D7C7D" stroke-width="1.5"/>
      <rect x="640" y="424" width="340" height="72" rx="8" fill="#EAF1F1" stroke="#4D7C7D" stroke-width="1.5"/>
      <rect x="640" y="518" width="340" height="72" rx="8" fill="#EAF1F1" stroke="#4D7C7D" stroke-width="1.5"/>
    </g>
    <circle cx="672" cy="366" r="6" fill="#4D7C7D"/><text x="692" y="373" fill="#1A1A1A" letter-spacing="1">PLATFORM-INDEPENDENT MSG</text>
    <circle cx="672" cy="460" r="6" fill="#4D7C7D"/><text x="692" y="467" fill="#1A1A1A" letter-spacing="1">ABSTRACTION LAYER</text>
    <circle cx="672" cy="554" r="6" fill="#C97A5C"/><text x="692" y="561" fill="#1A1A1A" letter-spacing="1">INTERFACE VALIDATION</text>
  </g>
  <text x="810" y="660" fill="#77756C" font-size="16" text-anchor="middle" font-family="IBM Plex Mono, monospace" letter-spacing="2">ROS2 · pub / sub prototype</text>

  <!-- arrows interface -> modules -->
  <path d="M 1025 350 C 1110 350, 1120 280, 1188 260" stroke="#2F5959" stroke-width="3" fill="none" marker-end="url(#ah2)"/>
  <path d="M 1025 440 C 1110 440, 1120 420, 1188 412" stroke="#2F5959" stroke-width="3" fill="none" marker-end="url(#ah2)"/>
  <path d="M 1025 530 C 1110 530, 1120 560, 1188 565" stroke="#2F5959" stroke-width="3" fill="none" marker-end="url(#ah2)"/>
  <path d="M 1025 610 C 1110 610, 1120 700, 1188 715" stroke="#2F5959" stroke-width="3" fill="none" stroke-dasharray="8 6" marker-end="url(#ah2)"/>
  <text x="1112" y="325" fill="#2F5959" font-size="17" font-family="IBM Plex Mono, monospace" font-weight="600" text-anchor="middle">pub / sub</text>

  <!-- modules band -->
  <g filter="url(#soft-sm)">
    <rect x="1195" y="180" width="325" height="600" rx="10" fill="#F1EFE7"/>
  </g>
  <text x="1225" y="222" fill="#77756C" font-size="17" font-family="IBM Plex Mono, monospace" letter-spacing="3" font-weight="600">MODULES</text>

  <g filter="url(#soft-sm)">
    <rect x="1225" y="240" width="265" height="110" rx="8" fill="#FFFFFF" stroke="#D8D5C9" stroke-width="1.5"/>
    <rect x="1225" y="392" width="265" height="110" rx="8" fill="#FFFFFF" stroke="#D8D5C9" stroke-width="1.5"/>
    <rect x="1225" y="544" width="265" height="110" rx="8" fill="#FFFFFF" stroke="#D8D5C9" stroke-width="1.5"/>
    <rect x="1225" y="678" width="265" height="80" rx="8" fill="#FAFAF7" stroke="#C5C2B8" stroke-width="1.5" stroke-dasharray="5 4"/>
  </g>
  <g font-size="26" font-weight="500">
    <circle cx="1255" cy="285" r="7" fill="#4D7C7D"/><text x="1275" y="293" fill="#1A1A1A">Module A</text>
    <circle cx="1255" cy="437" r="7" fill="#4D7C7D"/><text x="1275" y="445" fill="#1A1A1A">Module B</text>
    <circle cx="1255" cy="589" r="7" fill="#4D7C7D"/><text x="1275" y="597" fill="#1A1A1A">Module C</text>
    <text x="1357" y="726" fill="#9A988F" font-size="21" text-anchor="middle">Module N…</text>
  </g>
  <g font-size="16" fill="#77756C" font-family="IBM Plex Mono, monospace">
    <text x="1255" y="325">heterogeneous vendor</text>
    <text x="1255" y="477">heterogeneous vendor</text>
    <text x="1255" y="629">heterogeneous vendor</text>
  </g>

  <!-- bottom note -->
  <text x="800" y="836" fill="#77756C" font-size="19" text-anchor="middle">이기종 모듈이 표준 기반 공통 메시지 하나로 상호 운용 — 모듈 교체 시 인터페이스 수정 불필요</text>
</svg>
