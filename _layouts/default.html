<!DOCTYPE html>
<html lang="{{ page.lang | default: 'ko' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <div class="wrap">
    {% include header.html %}
    <main>
      {{ content }}
    </main>
    {% include footer.html %}
  </div>
  <script>
    document.addEventListener('click', function (e) {
      var img = e.target.closest('.figure img');
      if (!img) return;
      var box = document.createElement('div');
      box.className = 'lightbox';
      var big = document.createElement('img');
      big.src = img.src;
      big.alt = img.alt;
      box.appendChild(big);
      box.addEventListener('click', function () { box.remove(); });
      document.addEventListener('keydown', function esc(ev) {
        if (ev.key === 'Escape') { box.remove(); document.removeEventListener('keydown', esc); }
      });
      document.body.appendChild(box);
    });
  </script>
</body>
</html>
