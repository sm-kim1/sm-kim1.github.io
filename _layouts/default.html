<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - Sangmin Kim{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
{% if page.noindex %}  <meta name="robots" content="noindex">
{% endif %}  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <nav class="nav">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">Sangmin Kim</a>
      <ul>
        <li><a href="{{ '/#work' | relative_url }}">Work</a></li>
        <li><a href="{{ '/#how' | relative_url }}">How I work</a></li>
        <li><a href="{{ '/resume/' | relative_url }}">Resume</a></li>
        <li class="print-link"><a href="{{ '/print/' | relative_url }}">인쇄용 -></a></li>
      </ul>
    </div>
  </nav>

  {{ content }}

  {% include footer.html %}

  <script>
    document.querySelectorAll('.card figure img, .case main img').forEach(function (img) {
      var trigger = document.createElement('button');
      trigger.type = 'button';
      trigger.className = 'image-zoom';
      trigger.setAttribute('aria-label', (img.alt || '이미지') + ' 확대');
      trigger.setAttribute('aria-haspopup', 'dialog');
      img.before(trigger);
      trigger.appendChild(img);
      trigger.addEventListener('click', function () {
        var box = document.createElement('dialog');
        box.className = 'lightbox';
        box.setAttribute('aria-label', (img.alt || '이미지') + ' 확대 보기');
        var big = document.createElement('img');
        big.src = img.src;
        big.alt = img.alt;
        var close = document.createElement('button');
        close.type = 'button';
        close.className = 'lightbox-close';
        close.textContent = '닫기';
        close.autofocus = true;
        box.append(big, close);
        close.addEventListener('click', function () { box.close(); });
        box.addEventListener('keydown', function (e) {
          if (e.key === 'Tab') {
            e.preventDefault();
            close.focus();
          }
        });
        box.addEventListener('click', function (e) {
          if (e.target === box) box.close();
        });
        box.addEventListener('close', function () {
          box.remove();
          trigger.focus({ preventScroll: true });
        }, { once: true });
        document.body.appendChild(box);
        box.showModal();
      });
    });
  </script>
</body>
</html>
