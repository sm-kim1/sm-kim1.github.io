projects:
  title: Projects
  assignments:
    - title: Component Manager Development for a Small Unmanned Ground Vehicle (SUGV)
      period: 2024.02 — 2025.12
      role: Middleware Development
      image: assets/diagram-01-component-manager.svg
      tagline: Software development to support dynamic connection and disconnection of sensors/devices in the runtime environment of a ROS2-based SUGV platform.
      details: |
        - Developed a runtime component manager to handle hot-plug scenarios for sensors and devices
        - Designed a Dynamic Device Pool architecture to manage devices connected/disconnected at runtime on a per-pool basis
        - Implemented automatic registration/deregistration based on device connection/disconnection events
        - Standardized initialization and shutdown procedures for heterogeneous devices through Device lifecycle abstraction
        - Reduced per-device duplicate code by **23%** through a Generic Template-based service interface architecture
        - Eliminated redundant repeated calls in steady state by switching from periodic polling to a first-connection cache approach
        - Improved system stability by implementing timeout-based recovery/reconnect logic for failure scenarios
        - **Stack**: Environment: Ubuntu · ROS2 Humble / Architecture: x86_64 · Arm64 / Language: C++ / Protocol: CAN · Ethernet

    - title: Common Software Architecture Development for a Small Unmanned Ground Vehicle (SUGV)
      period: 2024.01 — 2024.04
