career-profile:
  title: About
  summary: |
    Embedded Platform Engineer with over five years of experience building autonomous vehicle platforms.
    Work spans BSP customization, kernel drivers, Device Tree and Yocto images for custom NVIDIA Jetson boards,
    through ROS1/2 middleware and device integration.

    - Delivered vehicle platforms for **5 government/institutional R&D programs**; 1 granted patent and 2 applications
    - Reduced code duplication from **28% to 21%** with generic interfaces (static analysis; 23% relative reduction)
    - Reduced disk use by **67%**, package count by **86%** and idle memory by **79%** with minimal Yocto images
    - Resolved camera capture and CAN driver root causes to improve field reliability
    - Built repeatable deployment workflows with scripts, validation steps and documentation

