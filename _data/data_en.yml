        - Defined a platform-independent message structure for interoperability between heterogeneous modules
        - Implemented a ROS2-based common message prototype and validated the pub/sub structure
        - Developed an abstraction layer for data interface standardization
        - Verified the communication structure based on the common message specification and performed module integration testing
        - **Stack**: Environment: Ubuntu · ROS2 Humble / Architecture: x86_64 · Arm64 / Language: C++ / Protocol: CAN · Ethernet

