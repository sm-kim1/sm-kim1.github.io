career-profile:
  title: About
  summary: |
    I have developed Embedded Linux, ROS1/2, and CAN/Ethernet-based Middleware and Device
    Integration architectures for autonomous vehicle and Small Unmanned Ground Vehicle (SUGV)
    platforms. Rather than simple feature implementation, my strength lies in designing Runtime
    Platforms that account for heterogeneous device connection/disconnection, state tracking,
    interface standardization, fault recovery, and real-world field deployment.

    ※ This portfolio summarizes project structures and contributions within what can be
    publicly disclosed, and excludes detailed designs and confidential information belonging
    to companies and clients.

