projects:
  title: 대표 프로젝트
  assignments:
    - title: 소형 무인 지상 차량(SUGV) Component Manager 개발
      period: 2024.02 — 2025.12
      role: Middleware Development
      image: assets/diagram-01-component-manager.svg
      tagline: ROS2 기반 SUGV 플랫폼의 런타임 환경에서 센서 · 디바이스의 동적 연결 및 해제를 지원하기 위한 SW 개발.
      details: |
        - 센서 및 디바이스의 hot-plug 상황을 처리하기 위한 런타임 컴포넌트 매니저 개발
        - Dynamic Device Pool 구조를 설계하여 런타임 중 연결 · 해제되는 디바이스를 Pool 단위로 관리
        - 디바이스 연결 · 해제 이벤트 기반 자동 등록 / 해제 기능 구현
        - Device lifecycle 추상화를 통해 이기종 디바이스 초기화 및 종료 절차 표준화
        - Generic Template 기반 서비스 인터페이스 구조 설계를 통해 디바이스별 중복 코드 **23% 감소**
        - Periodic polling에서 first-connection cache 방식으로 변경하여 안정 상태의 반복 호출 제거
        - 장애 발생 시 timeout 기반 recovery / reconnect 로직 구현으로 시스템 안정성 향상
        - **Stack**: Environment: Ubuntu · ROS2 Humble / Architecture: x86_64 · Arm64 / Language: C++ / Protocol: CAN · Ethernet

    - title: 소형 무인 지상 차량(SUGV) 공통 SW 아키텍처 개발
      period: 2024.01 — 2024.04
      role: Architecture Research · Middleware Development
      image: assets/diagram-02-common-architecture.svg
      tagline: SUGV 공통 SW 아키텍처와 소프트웨어 메시지 정의를 위한 기술 조사 및 프로토타입 개발.
      details: |
        - STANAG 및 JAUS 기반 command-message 구조를 분석하여 공통 메시지 인터페이스 설계
        - 이기종 모듈 간 상호 운용을 위한 플랫폼 독립형 메시지 구조 정의
        - ROS2 기반 공통 메시지 프로토타입 구현 및 pub / sub 구조 검증
        - 데이터 인터페이스 표준화를 위한 추상화 레이어 개발
        - 공통 메시지 규격 기반 통신 구조 검증 및 모듈 연동 테스트 수행
        - **Stack**: Environment: Ubuntu · ROS2 Humble / Architecture: x86_64 · Arm64 / Language: C++ / Protocol: CAN · Ethernet

    - title: ROS2 Multi-domain Template 개발
      period: 2023.11 — 2024.05
      role: Platform Development
      image: assets/diagram-03-multi-domain.svg
      tagline: ROS2 개발 환경을 재사용 가능하게 구성하기 위한 Multi-domain template 개발.
      details: |
        - 기존 ROS1 시스템의 ROS2 마이그레이션 진행
        - 기능별 도메인 사용을 위해 Multi-domain 시스템 개발
        - ROS2 기반 환경에서 domain 단위 범위와 실행 환경을 분리할 수 있는 템플릿 구성
        - 차량 플랫폼 내 ROS 개발 환경을 표준화하여 Module Integration 편의성 개선
        - **Stack**: Environment: Ubuntu · ROS2 Humble / Architecture: x86_64 · Arm64 / Language: C++ / Protocol: CAN · Ethernet

    - title: Autonomous Computing Platform based on NVIDIA Jetson
      period: 2023.09 — 2025.12
      role: Project Lead · Embedded Platform Development
      image: assets/project-04-a1-driver.png
      tagline: NVIDIA Jetson 기반 분산 컴퓨팅 모듈 기획 및 Kernel driver 개발.
      details: |
        - Jetson Orin 기반 Custom board 환경에서 BSP Customization 및 boot · runtime 안정화 수행
        - JetPack version migration 과정에서 device tree 및 peripheral 호환성 이슈 해결
        - GMSL 카메라 드라이버 및 vi5 capture 경로 디버깅 — busy-loop · DMA leak 수정으로 반복 캡처 안정화
        - apt kernel 업데이트가 custom kernel · DTB를 덮어쓰는 문제의 근본 원인 분석 및 방지 처리
        - CAN 통신 안정성 확보를 위해 mcp25xxfd driver 분석 및 kernel patch 적용
        - Ethernet switch 병목 분석 및 driver-level tuning을 통해 packet loss · 통신 지연 안정화
        - AGX / NX target 별 boot image 및 peripheral 초기화 검증, 현장 배포용 self-contained field patch 도구 제작
        - **Stack**: Environment: Ubuntu · ROS1 Noetic / Architecture: Arm64 / Platform: NVIDIA Jetson (AGX Orin · Orin NX) / Language: C / C++ · Shell · Device Tree / Protocol: CAN · Ethernet

    - title: Jetson BSP의 Yocto 포팅 및 최소화 이미지 빌드
      period: 2025.03 — 현재
      role: Embedded Platform Development
      tagline: Ubuntu 기반 JetPack BSP를 Yocto 빌드 시스템으로 포팅하여 재현 가능한 최소화 이미지 구축.
      details: |
        - vendor Ubuntu · JetPack BSP를 meta-tegra 기반 Yocto (scarthgap · 4.0 LTS) 빌드로 포팅
        - 단일 custom layer로 Orin NX · AGX Orin 두 machine 정의 — override 구문으로 보드별 분기, 레이어 수정 한 번으로 양쪽 반영
        - JetPack 대비 디스크 사용량 · 패키지 수 **91% 감소**한 최소화 이미지 구성
        - shared sstate-cache · downloads 구조로 두 machine 간 빌드 산출물 재사용
        - Yocto 미경험 엔지니어용 온보딩 가이드 · BSP 구조 문서 작성
        - **Stack**: Build: Yocto scarthgap · BitBake / Base: L4T R35.6.4 · JetPack 5.1.6 · kernel 5.10 / Architecture: Arm64

    - title: 자율주행 자동차 데이터 수집 장치 개발
      period: 2022.07 — 2022.12
      role: Middleware Development
      image: assets/diagram-10-data-collection.svg
      tagline: 자율주행 차량에서 개발 · 검증에 필요한 데이터를 수집하기 위한 SW 개발.
      details: |
        - 자율주행 개발 · 검증용 데이터 로깅 파이프라인 구성
        - 차량 플랫폼과 컴퓨팅 환경 간 데이터 수집 흐름 설계
        - Snapshot 기반 데이터 저장 구조 구현을 통해 특정 이벤트 구간 데이터 확보 지원
        - 사용자 정의 recording duration 기반 logging 기능 구현
        - 차량 환경 내 안정적인 데이터 수집을 위한 storage · network resource 관리
        - **Stack**: Environment: Ubuntu · ROS1 Melodic / Architecture: x86_64 · Arm64 / Language: C / C++ / Protocol: CAN · Ethernet

