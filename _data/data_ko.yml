career-profile:
  title: About
  summary: |
    센서가 꽂히고 빠져도, 커널이 업데이트돼도, 차는 계속 달려야 합니다.
    저는 그걸 가능하게 하는 Runtime Platform을 만듭니다.

    자율주행 차량과 소형 무인 지상 차량(SUGV) 플랫폼에서 5년 넘게 ROS1/2 Middleware와
    Device Integration 구조를 설계했고, 최근에는 NVIDIA Jetson 커스텀 보드의
    BSP · 커널 드라이버 · Yocto 이미지까지 내려가 보드 레벨부터 미들웨어까지
    전체 스택을 다룹니다.

    - 정부 R&D 과제 5건에서 자율주행 차량 플랫폼 구축, 특허 3건 출원
    - Generic Template 기반 인터페이스 설계로 디바이스별 중복 코드 **23% 감소**
    - Yocto 최소화 이미지로 JetPack 대비 디스크 · 패키지 **91% 축소**
    - 커널 드라이버(카메라 capture · CAN) 근본 원인 수정으로 현장 안정성 확보

